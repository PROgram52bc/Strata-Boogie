name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cvc5
        uses: strata-org/Strata/.github/actions/install-cvc5@main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone Strata-CLI (pinned)
        # Pinned to a known-good triple. Strata-CLI's lakefile floats its
        # dependencies to `main`, so a fresh clone rebuilds against whatever
        # Strata/Strata-DDM/Strata-Python happen to be at HEAD today — the
        # upstream API has drifted and StrataMainLib no longer compiles
        # against `main`. Pin the CLI commit and rewrite its lakefile revs to
        # the sibling commits that formed the last CI-verified-green build.
        env:
          STRATA_CLI_REV:    c35654437c
          STRATA_REV:        1024ac7c089f4a1e6e7ee9a639512d15fc934f65
          STRATA_PYTHON_REV: ea14d036a7fd7e40afe580c0bcad937ce7cfacc3
          STRATA_DDM_REV:    9d637231cf5b06fe8b93aa04949b19ce854e20a2
        run: |
          git clone https://github.com/strata-org/Strata-CLI.git StrataCLI
          cd StrataCLI
          git checkout "$STRATA_CLI_REV"
          # awk state machine: for each [[require]] block, replace the rev = "..."
          # line based on the block's name = "..." line. Exact-match on name so
          # "Strata" does not eat "StrataPython" / "StrataDDM".
          awk -v s="$STRATA_REV" -v p="$STRATA_PYTHON_REV" -v d="$STRATA_DDM_REV" '
            /^\[\[require\]\]/ { name=""; in_req=1 }
            in_req && /^name = "/ { match($0, /"[^"]*"/); n=substr($0, RSTART+1, RLENGTH-2); name=n }
            in_req && /^rev = "/ {
              new = (name=="Strata")?s:(name=="StrataPython")?p:(name=="StrataDDM")?d:""
              if (new != "") { print "rev = \"" new "\""; next }
            }
            /^\[/ && !/^\[\[require\]\]/ { in_req=0 }
            { print }
          ' lakefile.toml > lakefile.toml.new && mv lakefile.toml.new lakefile.toml
          echo "--- pinned lakefile.toml deps ---"
          grep -E 'name =|rev =' lakefile.toml

      - name: Build Strata-CLI
        uses: leanprover/lean-action@v1
        with:
          build-args: strata
          test: false
          lake-package-directory: StrataCLI

      - name: Restore dependencies
        run: dotnet restore BoogieToStrata.sln

      - name: Build
        run: dotnet build BoogieToStrata.sln --no-restore

      - name: Run integration tests
        env:
          STRATA_VERIFIER_PATH: ${{ github.workspace }}/StrataCLI/.lake/build/bin/strata
        run: dotnet test IntegrationTests/BoogieToStrata.IntegrationTests.csproj --no-build --verbosity normal
